services:
  levi:
    build: .
    container_name: levi
    restart: always
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      LEVI_DB_PATH: /data/levi.db
      PYTHONUNBUFFERED: "1"
      LEVI_API_KEY: ${LEVI_API_KEY:?LEVI_API_KEY is required; put it in .env}
    volumes:
      - ./levi.db:/data/levi.db:ro