services:
  levi:
    build: .
    container_name: levi
    restart: always
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      LEVI_DB_PATH: /data/levi.db
      PYTHONUNBUFFERED: "1"
      # Optional: when set (see .env), every endpoint except /health requires
      # Authorization: Bearer <key>. Unset keeps the public read-only door.
      LEVI_API_KEY: ${LEVI_API_KEY:-}
    volumes:
      - ./levi.db:/data/levi.db:ro