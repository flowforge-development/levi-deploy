services:
  levi:
    build: .
    container_name: levi
    restart: always
    ports:
      - "127.0.0.1:8777:8777"
    environment:
      LEVI_DB_PATH: /data/levi.db
      PYTHONUNBUFFERED: "1"
      # Optional: when set (see .env), every endpoint except /health requires
      # Authorization: Bearer <key>. Unset keeps the public read-only door.
      LEVI_API_KEY: ${LEVI_API_KEY:-}
      LEVI_VEC_PATH: /data/verse_vectors.db
      LEVI_GRAPH3D_PATH: /data/graph3d.json
      # Semantic query embedding (same model as the host-built index):
      # LEVI_EMBED_URL: https://openrouter.ai/api/v1
      # LEVI_EMBED_MODEL: BAAI/bge-m3
      # LEVI_EMBED_KEY: (OpenRouter key; set via .env when vectors land)
      LEVI_EMBED_URL: ${LEVI_EMBED_URL:-}
      LEVI_EMBED_MODEL: ${LEVI_EMBED_MODEL:-BAAI/bge-m3}
      LEVI_EMBED_KEY: ${LEVI_EMBED_KEY:-}
    volumes:
      - ./levi.db:/data/levi.db:ro
      - ./verse_vectors.db:/data/verse_vectors.db:ro
      - ./graph3d.json:/data/graph3d.json:ro